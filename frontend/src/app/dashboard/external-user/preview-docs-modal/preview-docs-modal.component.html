<!-- HEADER -->
<div class="modal-header modern-modal-header">
  <div class="modal-title-wrapper">
    <div class="modal-icon">
      <i class="far fa-file-pdf"></i>
    </div>
    <div>
      <h4 class="modal-title">
        {{ payload.firstName }}'s Documents
      </h4>
      <p class="modal-subtitle">
        Click any file to download it
      </p>
    </div>
  </div>

  <button type="button" class="btn-close-modern" (click)="activeModal.dismiss()">
    <i class="fas fa-times"></i>
  </button>
</div>

<!-- BODY -->
<div class="modal-body modern-modal-body">

  <!-- EMPTY STATE -->
  <div class="empty-state" *ngIf="!payload.external_docs || payload.external_docs.length === 0">
    <i class="fas fa-file-circle-xmark"></i>
    <h5>No Documents Found</h5>
    <p>This user doesn't have any uploaded files yet.</p>
  </div>

  <!-- FILE LIST -->
  <div class="docs-list" *ngIf="payload.external_docs?.length > 0">
    <ng-scrollbar style="height: 360px" visibility="hover">

      <div class="doc-item"
           *ngFor="let doc of payload.external_docs"
           (click)="downloadFile(doc)">

        <div class="doc-icon">
          <i class="far fa-file-pdf"></i>
        </div>

        <div class="doc-info">
          <span class="doc-name">{{ doc }}</span>
          <span class="doc-meta">Click to download</span>
        </div>

        <div class="doc-action">
          <i class="fas fa-download"></i>
        </div>

      </div>

    </ng-scrollbar>
  </div>

</div>
