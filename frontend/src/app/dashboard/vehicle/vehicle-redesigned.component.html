<!-- PTE — Vehicle Calendar (Redesigned)                                    -->
<!-- Controller: calendarOptions, vehicles, addVehicle, addEvent, etc.      -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->

<div class="pte-page">
  <div class="pte-page__header">
    <div class="pte-page__header-left">
      <div class="pte-page__breadcrumb">
        <a routerLink="/dashboard/main">Dashboard</a><span class="separator">/</span>
        <span>Resources</span><span class="separator">/</span><span class="current">Vehicles</span>
      </div>
      <h1 class="pte-page__header-title">Vehicle Calendar</h1>
      <p class="pte-page__header-subtitle">Book and manage vehicle reservations</p>
    </div>
    <div class="pte-page__header-actions">
      <button class="pte-btn pte-btn--primary" (click)="addVehicle()">+ Add Vehicle</button>
    </div>
  </div>

  <div class="pte-card">
    <div class="pte-card__body" style="padding:0;">
      <div class="pte-page__calendar">
        <!-- Vehicle List -->
        <div class="pte-page__calendar-sidebar">
          <h4 style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--pte-text-secondary);text-transform:uppercase;letter-spacing:0.5px;">Vehicles</h4>
          <div *ngFor="let v of vehicles" class="resource-card">
      <div class="resource-card__name">{{ v.model || v.type }}</div>
      <div class="resource-card__detail">{{ v.registration_number || '' }}</div>
          </div>
        </div>

        <!-- Calendar -->
        <div class="pte-page__calendar-main">
          <full-calendar [options]="calendarOptions"></full-calendar>
        </div>
      </div>
    </div>
  </div>
</div>
