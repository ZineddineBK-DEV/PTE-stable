<div class="modal-container" *ngIf="payload">

  <!-- Modal Header -->
  <div class="modal-header-modern">
    <div class="header-banner">
      <div class="header-avatar-wrap">
        <img [src]="picsUrl + payload.image" [alt]="payload.firstName" class="header-avatar" />
        <div class="avatar-status online"></div>
      </div>
      <div class="header-info">
        <h4 class="header-name">{{ payload.firstName + " " + payload.lastName }}</h4>
        <span class="header-badge">{{ payload.title }}</span>
      </div>
    </div>
    <button class="btn-close-modern" (click)="activeModal.dismiss()">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- Modal Body -->
  <div class="modal-body-modern">

    <!-- Info Rows -->
    <div class="info-section">

      <div class="info-row">
        <div class="info-icon-wrap info-icon--blue">
          <i class="fas fa-envelope"></i>
        </div>
        <div class="info-content">
          <span class="info-label">Email</span>
          <span class="info-value">{{ payload.email }}</span>
        </div>
      </div>

      <div class="info-row">
        <div class="info-icon-wrap info-icon--purple">
          <i class="fas fa-phone-alt"></i>
        </div>
        <div class="info-content">
          <span class="info-label">Phone</span>
          <span class="info-value">{{ payload.phone }}</span>
        </div>
      </div>

      <div class="info-row">
        <div class="info-icon-wrap info-icon--teal">
          <i class="fas fa-building"></i>
        </div>
        <div class="info-content">
          <span class="info-label">Department</span>
          <span class="info-value">{{ payload.departement }}</span>
        </div>
      </div>

      <div class="info-row" style="border-bottom: none;">
        <div class="info-icon-wrap info-icon--gold">
          <i class="fas fa-star"></i>
        </div>
        <div class="info-content">
          <span class="info-label">Experience</span>
          <span class="info-value">
            {{ payload.experience }}
            <span *ngIf="payload.experience > 1"> Years</span>
            <span *ngIf="payload.experience <= 1"> Year</span>
          </span>
        </div>
        <div class="exp-badge">
          <i class="fas fa-award"></i>
          {{ payload.experience > 5 ? 'Senior' : payload.experience > 2 ? 'Mid-Level' : 'Junior' }}
        </div>
      </div>

    </div>
  </div>

  <!-- Modal Footer -->
  <div class="modal-footer-modern">
    <button class="btn-modern btn-secondary" (click)="activeModal.dismiss()">
      <i class="fas fa-times"></i> Close
    </button>
  </div>

</div>
