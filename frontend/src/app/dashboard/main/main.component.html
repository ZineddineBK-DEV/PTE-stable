<section class="main-content">
  <div class="section-body">
    <div class="row g-4 m-t-5">
      <div class="col-xl-3 col-lg-6 col-md-6">
        <div class="card-stat h-100 border-0 shadow-sm overflow-hidden position-relative">
          <div class="card-gradient users-gradient"></div>
          <div class="card-body p-4 d-flex flex-column position-relative z-1">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <div>
                <h6 class="fw-medium mb-1 fs-6">Users</h6>
                <h3 class="fw-bold mb-0">{{userCount}}</h3>
              </div>
              <div class="bg-primary-subtle rounded-circle p-3">
                <i class="fas fa-users fa-2x text-primary"></i>
              </div>
            </div>
            <a routerLink="/dashboard/userList" class="text-decoration-none fw-medium small mt-auto accent-link">
              See more <i class="fas fa-arrow-right ms-1"></i>
            </a>
          </div>
        </div>
      </div>

      <div class="col-xl-3 col-lg-6 col-md-6">
        <div class="card-stat h-100 border-0 shadow-sm overflow-hidden position-relative">
          <div class="card-gradient vehicles-gradient"></div>
          <div class="card-body p-4 d-flex flex-column position-relative z-1">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div>
                <h6 class=" fw-medium mb-1 fs-6">Vehicles</h6>
                <h3 class="fw-bold mb-1">{{vehicleCount}}</h3>
              </div>
              <div class="bg-success-subtle rounded-circle p-3">
                <i class="fas fa-car fa-2x text-success"></i>
              </div>
            </div>
            <ng-container *ngIf="userRoles === 'ADMIN' || userRoles === 'ASSISTANT'; else noAccess">
              <a routerLink="/dashboard/vehicle" class="accent-link text-decoration-none fw-medium small mt-auto">
                See more <i class="fas fa-arrow-right ms-1"></i>
              </a>
            </ng-container>
            <ng-template #noAccess>
              <span class=" fw-medium small mt-auto cursor-default">
                See more <i class="fas fa-arrow-right ms-1"></i>
              </span>
            </ng-template>
          </div>
        </div>
      </div>
      <div class="col-xl-3 col-lg-6 col-md-6">
        <div class="card-stat h-100 border-0 shadow-sm overflow-hidden position-relative">
          <div class="card-gradient rooms-gradient"></div>
          <div class="card-body p-4 d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <div>
                <h6 class=" fw-medium mb-1 fs-6">Rooms</h6>
                <h3 class="fw-bold mb-0">{{roomCount}}</h3>
              </div>
              <div class="bg-info-subtle rounded-circle p-3">
                <i class="fas fa-door-open fa-2x text-info"></i>
              </div>
            </div>
            <a routerLink="/dashboard/room" class="accent-link text-decoration-none fw-medium small mt-auto">
              See more <i class="fas fa-arrow-right ms-1"></i>
            </a>
          </div>
        </div>
      </div>

      <div class="col-xl-3 col-lg-6 col-md-6">
        <div class="card-stat h-100 border-0 shadow-sm overflow-hidden position-relative">
          <div class="card-gradient posts-gradient"></div>
          <div class="card-body p-4 d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <div>
                <h6 class=" fw-medium mb-1 fs-6">All Posts</h6>
                <h3 class="fw-bold mb-0">{{approvedCount}}</h3>
              </div>
              <div class="bg-warning-subtle rounded-circle p-3">
                <i class="fas fa-newspaper fa-2x text-warning"></i>
              </div>
            </div>
            <a routerLink="/allnews" class="accent-link text-decoration-none fw-medium small mt-auto">
              See more <i class="fas fa-arrow-right ms-1"></i>
            </a>
          </div>
        </div>
      </div>
    </div>




    <div class="card modern-tabs-card shadow-sm border-0 rounded-4 m-t-15">
      <div class="padding-20 pt-4 pb-4">
        <ul ngbNav #nav="ngbNav" [(activeId)]="active" class="nav nav-pills gap-2 modern-pills">
          <li [ngbNavItem]="1" class="nav-item" *ngIf="canAccessTab('labs')">
            <a ngbNavLink class="nav-link">Labs</a>
            <ng-template ngbNavContent>
              <app-labs-kpis></app-labs-kpis>
            </ng-template>
          </li>
          <li [ngbNavItem]="2" class="nav-item" *ngIf="canAccessTab('missions')">
            <a ngbNavLink class="nav-link">Missions</a>
            <ng-template ngbNavContent>
              <app-mission-kpi></app-mission-kpi>
            </ng-template>
          </li>
          <li [ngbNavItem]="3" class="nav-item" *ngIf="canAccessTab('leaves')">
            <a ngbNavLink class="nav-link">Leaves</a>
            <ng-template ngbNavContent>
              <app-leave-kpi></app-leave-kpi>
            </ng-template>
          </li>
          <li [ngbNavItem]="4" class="nav-item" *ngIf="canAccessTab('my-leaves')">
            <a ngbNavLink class="nav-link">My leaves stats</a>
            <ng-template ngbNavContent>
              <app-my-leave-kpi></app-my-leave-kpi>
            </ng-template>
          </li>
          <li [ngbNavItem]="5" class="nav-item" *ngIf="canAccessTab('my-missions')">
            <a ngbNavLink class="nav-link">My mission stats</a>
            <ng-template ngbNavContent>
              <app-my-mission-kpi></app-my-mission-kpi>
            </ng-template>
          </li>

          <!-- <li [ngbNavItem]="6" class="nav-item" *ngIf="canAccessTab('interns')">
            <a ngbNavLink class="nav-link">Interns</a>
            <ng-template ngbNavContent>
              TEST4
            </ng-template>
          </li> -->
        </ul>

        <div [ngbNavOutlet]="nav" class="mt-4 tab-content-modern"></div>
      </div>
    </div>
  </div>


</section>
