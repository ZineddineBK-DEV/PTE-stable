<div class="pte-empty-state" style="min-height:100vh;padding:80px 40px;">
  <div style="font-size:120px;font-weight:800;color:var(--pte-gray-200);line-height:1;">404</div>
  <div class="pte-empty-state__title" style="font-size:24px;margin-top:16px;">Page Not Found</div>
  <div class="pte-empty-state__description" style="max-width:400px;">
    The page you're looking for doesn't exist or has been moved.
  </div>
  <div style="margin-top:32px;display:flex;gap:12px;">
    <a routerLink="/dashboard/main" class="pte-btn pte-btn--primary">Go to Dashboard</a>
    <a routerLink="/authentication/signin" class="pte-btn pte-btn--secondary">Sign In</a>
  </div>
</div>
