<!-- PTE Code Validation — Redesigned -->
<!-- Controller: codeSendForm, onSubmit() -->
<div class="pte-auth">
  <div class="pte-auth__brand">
    <div class="pte-auth__brand-content">
      <h1 class="pte-auth__brand-title">PTE</h1>
      <p class="pte-auth__brand-subtitle">Code Verification</p>
    </div>
  </div>
  <div class="pte-auth__form">
    <div class="pte-auth__form-inner">
      <h2 class="pte-auth__form-title">Code Validation</h2>
      <p class="pte-auth__form-subtitle">Enter your code to reset your password.</p>
      <form (ngSubmit)="onSubmit()" [formGroup]="codeSendForm">
        <div class="pte-form-field">
          <label class="pte-form-field__label" for="code">Confirmation Code</label>
          <input type="text" class="pte-form-field__input" formControlName="code" required autofocus>
        </div>
        <button type="submit" class="pte-btn pte-btn--primary" style="width:100%;margin-top:8px;">Submit Code</button>
      </form>
      <p class="pte-auth__form-footer"><small><a routerLink="/authentication/signin" class="pte-auth__link">Back to Sign In</a></small></p>
    </div>
  </div>
</div>
