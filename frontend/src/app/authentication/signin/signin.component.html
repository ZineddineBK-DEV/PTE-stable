<!-- PTE Sign In — Redesigned -->
<!-- Controller: loginForm, error, onSubmit() -->
<div class="pte-auth">
  <div class="pte-auth__brand">
    <div class="pte-auth__brand-content">
      <h1 class="pte-auth__brand-title">PTE</h1>
      <p class="pte-auth__brand-subtitle">Resource Management Platform</p>
    </div>
  </div>
  <div class="pte-auth__form">
    <div class="pte-auth__form-inner">
      <h2 class="pte-auth__form-title">Sign In</h2>
      <p class="pte-auth__form-subtitle">Welcome back! Enter your credentials to access your account.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="pte-form-field">
          <label class="pte-form-field__label">Your Email <span class="text-danger">*</span></label>
          <input type="email" class="pte-form-field__input" formControlName="email" placeholder="Email" autofocus>
          <small class="pte-form-field__error" *ngIf="!loginForm.get('email')?.valid && loginForm.get('email')?.touched">Email is invalid</small>
        </div>

        <div class="pte-form-field">
          <label class="pte-form-field__label">Password <span class="text-danger">*</span></label>
          <input type="password" class="pte-form-field__input" formControlName="password" placeholder="Password">
          <small class="pte-form-field__error" *ngIf="!loginForm.get('password')?.valid && loginForm.get('password')?.touched">Password is invalid</small>
        </div>

        <div class="pte-auth__form-row" style="display:flex;justify-content:flex-end;">
          <p class="mb-0"><a routerLink="/authentication/forgot" class="pte-auth__link">Forgot password?</a></p>
        </div>

        <div *ngIf="error" class="pte-form-field__error" style="margin-bottom:12px;text-align:center;">{{error}}</div>

        <button type="submit" class="pte-btn pte-btn--primary" style="width:100%;margin-top:8px;">Sign in</button>
      </form>

      <p class="pte-auth__form-footer">
        <small>Don't have an account? <a routerLink="/authentication/signup" class="pte-auth__link">Sign Up</a></small>
      </p>
    </div>
  </div>
</div>
