<!-- PTE Auth — Reset Password (Redesigned)                                  -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->

<div class="pte-auth">
  <div class="pte-auth__brand">
    <div class="pte-auth__brand-logo">P</div>
    <h1 class="pte-auth__brand-title">Reset Password</h1>
    <p class="pte-auth__brand-subtitle">Choose a strong new password for your account.</p>
  </div>

  <div class="pte-auth__form">
    <div class="pte-auth__card">
      <h2 class="pte-auth__title">New Password</h2>
      <p class="pte-auth__subtitle">Enter and confirm your new password</p>

      <form [formGroup]="ChangePasswordForm" (ngSubmit)="onSubmit()">
        <div class="pte-auth__field">
          <label>New Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" formControlName="password" placeholder="Enter new password">
          </div>
        </div>

        <div class="pte-auth__field">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" formControlName="Cpassword" placeholder="Confirm new password">
          </div>
        </div>

        <button type="submit" class="pte-btn pte-btn--primary pte-auth__submit">
          Reset Password
        </button>
      </form>

      <p class="pte-auth__footer">
        <a routerLink="/authentication/signin">← Back to Sign In</a>
      </p>
    </div>
  </div>
</div>
