<!-- PTE Reset Password — Redesigned -->
<!-- Controller: ChangePasswordForm, onSubmit() -->
<div class="pte-auth">
  <div class="pte-auth__brand">
    <div class="pte-auth__brand-content">
      <h1 class="pte-auth__brand-title">PTE</h1>
      <p class="pte-auth__brand-subtitle">New Password</p>
    </div>
  </div>
  <div class="pte-auth__form">
    <div class="pte-auth__form-inner">
      <h2 class="pte-auth__form-title">Reset Password</h2>
      <p class="pte-auth__form-subtitle">Enter your new password.</p>
      <form [formGroup]="ChangePasswordForm" (ngSubmit)="onSubmit()">
        <div class="pte-form-field">
          <label class="pte-form-field__label" for="password">New Password</label>
          <input id="password" type="password" class="pte-form-field__input" formControlName="password" required>
        </div>
        <div class="pte-form-field">
          <label class="pte-form-field__label" for="password-confirm">Confirm Password</label>
          <input id="password-confirm" type="password" class="pte-form-field__input" formControlName="Cpassword" required>
        </div>
        <button type="submit" class="pte-btn pte-btn--primary" style="width:100%;margin-top:8px;" tabindex="4">Reset Password</button>
      </form>
      <p class="pte-auth__form-footer"><small><a routerLink="/authentication/signin" class="pte-auth__link">Back to Sign In</a></small></p>
    </div>
  </div>
</div>
